methodology: |
  We constructed an optimized keyword-overlap similarity model blending hard requirement matching, experience alignment, service company filtering, and recruiter-engagement metrics.
  Anomalous 'honeypots' containing mismatched titles/descriptions or impossible career durations are dynamically filtered out.
  This pipeline runs under 1 minute on a CPU-only environment.
